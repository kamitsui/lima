# Web 開発用 Debian 13 環境
# 設計判断の経緯は Issues #2, #3, #4 を参照

vmType: "vz"

# amd64 コンテナ/バイナリ実行用(デプロイ先が x86_64 の場合や amd64 のみ配布のイメージ対策)
# 【既知の制約】ゲストカーネル 6.11 以降では Rosetta が
# "Failed to find vdso DT_HASH" で失敗する(Apple 側の未修正バグ、FB16455916)。
# Debian 13 はカーネル 6.12 のため現状 amd64 実行は不可。代替手段は Issue #13 を参照。
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

cpus: 4
memory: "8GiB"
disk: "100GiB"

# latest を参照するため、再構築時は常にその時点の最新 trixie イメージになる(cattle 運用)。
# ビルドを固定したい場合はダイジェスト付きの日付別 URL に置き換える。
images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"

# ゲストユーザーは全環境共通の汎用名にする(ホスト個人名の複製を避ける。Issue #14)
# shell は cloud-init 時点で zsh 未導入のため既定のまま(provisioning の chsh が担当)
user:
  name: dev
  comment: dev
  home: /home/dev

# コードはゲスト内で完結させる方針のため、ホストのディレクトリはマウントしない
mounts: []

ssh:
  # ホストの鍵はエージェント転送で使う(秘密鍵をゲストにコピーしない)
  forwardAgent: true

# Docker は provisioning で docker-ce を導入するため、Lima 内蔵の containerd は無効化
containerd:
  system: false
  user: false

# ── provisioning(システム層)─────────────────────────────────
# 毎起動実行されるため、すべて冪等に書く(導入済みなら何もしない)
provision:
  # apt 基礎パッケージ・locale・timezone
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      # build-essential, procps, curl, file, git は Homebrew on Linux の前提パッケージ
      pkgs=(build-essential procps curl file git zsh locales ca-certificates gnupg)
      if ! dpkg -s "${pkgs[@]}" >/dev/null 2>&1; then
        apt-get update
        apt-get install -y "${pkgs[@]}"
      fi
      if ! grep -q '^en_US.UTF-8' /etc/locale.gen || ! grep -q '^ja_JP.UTF-8' /etc/locale.gen; then
        sed -i -e 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' \
               -e 's/^# *ja_JP.UTF-8 UTF-8/ja_JP.UTF-8 UTF-8/' /etc/locale.gen
        locale-gen
      fi
      if [ "$(timedatectl show -p Timezone --value)" != "Asia/Tokyo" ]; then
        timedatectl set-timezone Asia/Tokyo
      fi

  # sshd: ホストから COLORTERM を受け取る(truecolor 伝搬。ホスト側 SendEnv は #6)
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      conf=/etc/ssh/sshd_config.d/60-colorterm.conf
      if [ ! -f "$conf" ]; then
        printf 'AcceptEnv COLORTERM\n' > "$conf"
        systemctl try-reload-or-restart ssh || true
      fi

  # Docker CE(公式 apt リポジトリ)+ docker グループ(sudo なし docker)
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v docker >/dev/null 2>&1; then
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $codename stable" \
          > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      fi

  # sudo なし docker(docker グループへ追加)。LIMA_CIDATA 変数は非推奨のため
  # user モードで実行し、自分のユーザー名を id で解決する
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! getent group docker | grep -qw "$(id -un)"; then
        sudo usermod -aG docker "$(id -un)"
      fi

  # wezterm terminfo と Homebrew の PATH 下地
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      # wezterm の terminfo(TERM=wezterm をゲストで解決できるようにする)
      if ! infocmp wezterm >/dev/null 2>&1; then
        t=$(mktemp)
        curl -fsSL -o "$t" https://raw.githubusercontent.com/wezterm/wezterm/main/termwiz/data/wezterm.terminfo
        tic -x -o /usr/share/terminfo "$t"
        rm -f "$t"
      fi
      # bash ログインシェル用
      if [ ! -f /etc/profile.d/homebrew.sh ]; then
        echo '[ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' \
          > /etc/profile.d/homebrew.sh
      fi
      # zsh 用は zshenv へ(非対話の `ssh guest cmd` でも brew が使えるように)
      if ! grep -q linuxbrew /etc/zsh/zshenv 2>/dev/null; then
        echo '[ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' \
          >> /etc/zsh/zshenv
      fi

  # Homebrew 本体 + 基本ツール(ARM64 Linux は brew 5.0 で Tier 1 サポート)
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
        NONINTERACTIVE=1 /bin/bash -c \
          "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      fi
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      export HOMEBREW_NO_AUTO_UPDATE=1
      # formula 名 → 実行ファイル名。存在チェックで冪等化し、毎起動を高速に保つ
      declare -A tools=(
        [vim]=vim [neovim]=nvim [yazi]=yazi [fzf]=fzf [starship]=starship
        [stow]=stow [bat]=bat [ripgrep]=rg [fd]=fd [ghq]=ghq [jq]=jq
      )
      missing=()
      for f in "${!tools[@]}"; do
        command -v "${tools[$f]}" >/dev/null || missing+=("$f")
      done
      if [ ${#missing[@]} -gt 0 ]; then
        brew install "${missing[@]}"
      fi

  # ゲストからの git 操作の下準備(github.com のホストキーを事前登録)
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
      if ! grep -q github.com "$HOME/.ssh/known_hosts" 2>/dev/null; then
        ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
      fi

  # ログインシェルを zsh へ(+ 初回設定ウィザード抑止のプレースホルダ)
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      # dotfiles 導入(#9/#10)までのプレースホルダ。ZDOTDIR 移行後は読まれなくなるので残っても無害
      if [ ! -e "$HOME/.zshrc" ] && [ ! -e "$HOME/.zshenv" ]; then
        printf '# placeholder: dotfiles 導入(Issue #9/#10)までの仮ファイル(zsh-newuser-install 抑止)\n' \
          > "$HOME/.zshrc"
      fi
      me=$(id -un)
      if [ "$(getent passwd "$me" | cut -d: -f7)" != "/usr/bin/zsh" ]; then
        sudo chsh -s /usr/bin/zsh "$me"
      fi
